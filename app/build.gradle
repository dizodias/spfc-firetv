plugins {
    id 'com.android.application'
}

android {
    namespace 'br.lucas.spfc'
    compileSdk 34

    defaultConfig {
        applicationId 'br.lucas.spfc'
        // Fire TV Stick 4K (1ª geração): Fire OS 6 / Android 7.1.
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Instalado por ADB, como o launcher: assinado com a chave de debug.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all { test ->
            test.doFirst {
                test.setClasspath(files(test.classpath.files.findAll { it.name != 'android.jar' }))
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        error 'NewApi'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // java.time no Android 7 (minSdk 25). O R8 fica só com o que o app chama.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
